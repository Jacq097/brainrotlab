<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#D2E4FC">
    <title>Brainrot Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            background: #f8fafc;
        }

        .mobile-canvas {
            background-image:
                linear-gradient(to bottom, #D2E4FC 0%, #DCEBFF 48%, #FEF9C3 100%);
        }

        .halftone-corner {
            position: absolute;
            width: 210px;
            height: 210px;
            pointer-events: none;
            background-image:
                radial-gradient(circle, #FFE600 1.55px, transparent 1.7px),
                linear-gradient(45deg, rgba(255, 230, 0, 0.28) 1px, transparent 1px),
                linear-gradient(-45deg, rgba(255, 230, 0, 0.28) 1px, transparent 1px);
            background-size: 14px 14px, 18px 18px, 18px 18px;
            transform: rotate(45deg);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, #000 34%, transparent 72%);
            mask-image: radial-gradient(circle at 50% 50%, #000 34%, transparent 72%);
        }

        .halftone-top-left {
            top: -58px;
            left: -58px;
            -webkit-mask-image: radial-gradient(circle at 0% 0%, #000 0%, #000 34%, transparent 72%);
            mask-image: radial-gradient(circle at 0% 0%, #000 0%, #000 34%, transparent 72%);
        }

        .halftone-bottom-right {
            right: -58px;
            bottom: -58px;
            -webkit-mask-image: radial-gradient(circle at 100% 100%, #000 34%, transparent 72%);
            mask-image: radial-gradient(circle at 100% 100%, #000 0%, #000 34%, transparent 72%);
        }

        .nav-pill {
            position: relative;
            isolation: isolate;
        }

        .nav-pill::before {
            content: "";
            position: absolute;
            left: 0.62rem;
            top: 50%;
            z-index: 1;
            width: 5px;
            height: 5px;
            border-radius: 9999px;
            background: #FACC15;
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.18), 0 0 9px rgba(250, 204, 21, 0.45);
            pointer-events: none;
            opacity: 0;
            transform: translateY(-50%) scale(0.35);
            transition: opacity 300ms ease-out, transform 300ms ease-out;
        }

        .nav-pill:hover::before,
        .nav-pill:focus-visible::before,
        .nav-pill.is-active::before {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }

        .start-clay {
            animation: clay-pulse 2.4s ease-in-out infinite;
        }

        .start-clay:hover,
        .start-clay:active {
            animation: none;
        }

        @keyframes clay-pulse {
            0%, 100% {
                box-shadow: inset 0 4px 6px 0 rgba(255, 255, 255, 0.4), 0 8px 20px -2px rgba(30, 58, 138, 0.3);
            }
            50% {
                box-shadow: inset 0 4px 6px 0 rgba(255, 255, 255, 0.5), 0 10px 24px -2px rgba(30, 58, 138, 0.38);
            }
        }
    </style>

    <style id="tablet-ipad-responsive-fix">
/* Tablet / iPad layout fix
   Only active on tablet-sized viewports. Existing mobile/desktop layout,
   JavaScript, text, colors, assets and interactions are intentionally left alone. */
@media screen and (min-width: 700px) and (max-width: 1280px) {
    html, body {
        width: 100%;
        min-width: 0;
        overflow-x: hidden;
    }

    /* Pages built around the 430px mobile canvas */
    body > main[class*="max-w-[430px]"] {
        width: 100% !important;
        max-width: none !important;
        margin-left: auto !important;
        margin-right: auto !important;
    }

    /* Keep tablet content centered and readable instead of stretching edge-to-edge. */
    body > main[class*="max-w-[430px]"] > header,
    body > main[class*="max-w-[430px]"] > section[aria-label="Rizzearch Fact abstracts"],
    body > main[class*="max-w-[430px]"] > section[aria-label="Daftar istilah brainrot"],
    body > main[class*="max-w-[430px]"] > section[aria-label="Team members"],
    body > main[class*="max-w-[430px]"] > section[aria-label="Quiz progress"],
    body > main[class*="max-w-[430px]"] > section[aria-label="Quiz question"] {
        width: 100% !important;
        max-width: 820px !important;
        margin-left: auto !important;
        margin-right: auto !important;
    }

    /* Keep the original padding feel while giving the tablet some breathing room. */
    body > main[class*="max-w-[430px]"] > header {
        box-sizing: border-box;
        padding-left: 24px !important;
        padding-right: 24px !important;
    }

    /* Index / home page: the title artwork can use the extra tablet space. */
    body > main[class*="max-w-[430px]"] > section[aria-label="BRAINROT LAB title"] > div {
        width: 90% !important;
        max-width: 560px !important;
    }

    body > main[class*="max-w-[430px]"] > section[aria-label="Deskripsi Brainrot Lab"] {
        max-width: 520px !important;
    }

    body > main[class*="max-w-[430px]"] > section[aria-label="Start quiz"] {
        width: 100% !important;
        max-width: none !important;
        margin-left: auto !important;
        margin-right: auto !important;
    }

    /* Fact / dictionary / team cards stay centered and don't become extremely wide. */
    body > main[class*="max-w-[430px]"] > section[aria-label="Rizzearch Fact abstracts"] {
        max-width: 800px !important;
    }

    body > main[class*="max-w-[430px]"] > section[aria-label="Daftar istilah brainrot"] {
        max-width: 820px !important;
    }

    body > main[class*="max-w-[430px]"] > section[aria-label="Team members"] {
        max-width: 780px !important;
    }

    body > main[class*="max-w-[430px]"] > section[aria-label="Quiz progress"],
    body > main[class*="max-w-[430px]"] > section[aria-label="Quiz question"] {
        max-width: 720px !important;
    }

    /* Result page uses max-w-sm on a wrapper rather than a 430px main. */
    body > div:first-of-type {
        width: 100% !important;
        max-width: 680px !important;
    }

    /* Do not let the result screenshot card or modal pick up the wrapper width. */
    #resultCard {
        width: 100% !important;
    }
}
    </style>

<style id="phone-index-final-fix">
/* Universal mobile responsive correction for the home page.
   Uses the actual viewport width instead of the old fixed 430px canvas.
   No scripts, text, assets, or interactions are changed. */
@media screen and (max-width: 699px) {
    html, body {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        overflow-x: hidden;
    }

    body > main[class*="max-w-[430px]"] {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        box-sizing: border-box !important;
        overflow-x: hidden !important;
    }

    /* Navigation scales with the phone instead of keeping tablet-sized pills. */
    body > main[class*="max-w-[430px]"] > nav {
        width: 100% !important;
        box-sizing: border-box !important;
        gap: clamp(5px, 2vw, 10px) !important;
        padding-left: clamp(7px, 2.5vw, 14px) !important;
        padding-right: clamp(7px, 2.5vw, 14px) !important;
        padding-top: clamp(14px, 4vw, 24px) !important;
    }

    body > main[class*="max-w-[430px]"] > nav .nav-pill {
        flex: 1 1 0 !important;
        width: auto !important;
        min-width: 0 !important;
        max-width: none !important;
        padding: clamp(6px, 1.8vw, 9px) clamp(5px, 2vw, 12px) !important;
        font-size: clamp(9px, 2.8vw, 12px) !important;
        line-height: 1.2 !important;
        white-space: nowrap !important;
        box-sizing: border-box !important;
    }

    /* Title: width follows the real viewport, so it cannot spill off narrow phones. */
    body > main[class*="max-w-[430px]"] > section[aria-label="BRAINROT LAB title"] {
        width: 100% !important;
        box-sizing: border-box !important;
        margin-top: clamp(9rem, 39vh, 15rem) !important;
        padding-left: clamp(4px, 2vw, 10px) !important;
        padding-right: clamp(4px, 2vw, 10px) !important;
    }

    body > main[class*="max-w-[430px]"] > section[aria-label="BRAINROT LAB title"] > div {
        width: min(92vw, 380px) !important;
        max-width: min(92vw, 380px) !important;
        margin-left: auto !important;
        margin-right: auto !important;
        box-sizing: border-box !important;
    }

    body > main[class*="max-w-[430px]"] > section[aria-label="BRAINROT LAB title"] img[alt=""]:first-of-type {
        width: 100% !important;
        max-width: 100% !important;
    }

    /* Decorative characters scale with the title instead of staying fixed. */
    body > main[class*="max-w-[430px]"] > section[aria-label="BRAINROT LAB title"] img[alt=""] {
        max-width: none !important;
    }
    body > main[class*="max-w-[430px]"] > section[aria-label="BRAINROT LAB title"] img[src*="character 1"] {
        width: clamp(48px, 18vw, 80px) !important;
        left: clamp(18px, 7vw, 30px) !important;
        top: clamp(-26px, -7vw, -18px) !important;
    }
    body > main[class*="max-w-[430px]"] > section[aria-label="BRAINROT LAB title"] img[src*="kaca_pembesar"] {
        width: clamp(38px, 13vw, 56px) !important;
        height: auto !important;
        right: clamp(-4px, -1vw, 0px) !important;
        top: clamp(-24px, -6vw, -14px) !important;
    }

    /* Description stays inside the viewport on every phone width. */
    body > main[class*="max-w-[430px]"] > section[aria-label="Deskripsi Brainrot Lab"] {
        width: min(94vw, 360px) !important;
        max-width: min(94vw, 360px) !important;
        margin-top: clamp(2px, 1vw, 6px) !important;
        padding-left: 4px !important;
        padding-right: 4px !important;
        box-sizing: border-box !important;
    }

    body > main[class*="max-w-[430px]"] > section[aria-label="Deskripsi Brainrot Lab"] p {
        max-width: 100% !important;
        font-size: clamp(10px, 3.1vw, 13px) !important;
        line-height: 1.2 !important;
    }

    body > main[class*="max-w-[430px]"] > section[aria-label="Deskripsi Brainrot Lab"] img[src*="tung-tung"] {
        width: clamp(32px, 11vw, 48px) !important;
        left: clamp(-2px, -1vw, 0px) !important;
    }
    body > main[class*="max-w-[430px]"] > section[aria-label="Deskripsi Brainrot Lab"] img[src*="character 2"] {
        width: clamp(30px, 10vw, 44px) !important;
        right: clamp(-4px, -2vw, -1px) !important;
    }

    /* START is centered in the actual viewport and scales smoothly. */
    body > main[class*="max-w-[430px]"] > section[aria-label="Start quiz"] {
        width: 100% !important;
        max-width: none !important;
        margin-top: clamp(3rem, 9vh, 5rem) !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        padding-left: 12px !important;
        padding-right: 12px !important;
        box-sizing: border-box !important;
    }

    body > main[class*="max-w-[430px]"] > section[aria-label="Start quiz"] > a {
        width: clamp(150px, 55vw, 200px) !important;
        max-width: 200px !important;
        padding-top: clamp(9px, 2.7vw, 12px) !important;
        padding-bottom: clamp(9px, 2.7vw, 12px) !important;
        font-size: clamp(16px, 5vw, 20px) !important;
        margin-left: auto !important;
        margin-right: auto !important;
        box-sizing: border-box !important;
    }
}

/* Very narrow phones: give the title a little more breathing room. */
@media screen and (max-width: 360px) {
    body > main[class*="max-w-[430px]"] > nav .nav-pill {
        padding-left: 3px !important;
        padding-right: 3px !important;
        font-size: 9px !important;
    }
    body > main[class*="max-w-[430px]"] > section[aria-label="BRAINROT LAB title"] > div {
        width: 91vw !important;
        max-width: 330px !important;
    }
    body > main[class*="max-w-[430px]"] > section[aria-label="Deskripsi Brainrot Lab"] p {
        font-size: 10px !important;
    }
}
</style>

</head>
<body>
    <main class="relative mx-auto min-h-screen w-full max-w-[430px] overflow-hidden border border-slate-200 bg-transparent shadow-[0_24px_60px_-24px_rgba(15,23,42,0.28)] mobile-canvas" aria-label="BRAINROT LAB mobile canvas">
        <div class="halftone-corner halftone-top-left" aria-hidden="true"></div>
        <div class="halftone-corner halftone-bottom-right" aria-hidden="true"></div>

        <nav class="relative z-10 flex items-center justify-center gap-2 px-3 pt-6" aria-label="Main navigation">
            <a href="rizsearch-team.html" class="nav-pill is-active rounded-full border border-white/60 bg-white/90 px-3 py-1.5 pl-4 text-center text-[11px] font-semibold tracking-wide text-slate-800 shadow-[0_4px_14px_0_rgba(0,0,0,0.05)] backdrop-blur-md transition-all duration-300 ease-out hover:-translate-y-0.5 hover:shadow-md hover:text-slate-950 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-200">Rizzearch Team</a>
            <a href="rizsearch-fact.html" class="nav-pill rounded-full border border-white/60 bg-white/90 px-3 py-1.5 pl-4 text-center text-[11px] font-semibold tracking-wide text-slate-800 shadow-[0_4px_14px_0_rgba(0,0,0,0.05)] backdrop-blur-md transition-all duration-300 ease-out hover:-translate-y-0.5 hover:shadow-md hover:text-slate-950 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-200">Rizzearch Fact</a>
            <a href="mini-dictionary.html" class="nav-pill rounded-full border border-white/60 bg-white/90 px-3 py-1.5 pl-4 text-center text-[11px] font-semibold tracking-wide text-slate-800 shadow-[0_4px_14px_0_rgba(0,0,0,0.05)] backdrop-blur-md transition-all duration-300 ease-out hover:-translate-y-0.5 hover:shadow-md hover:text-slate-950 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-200">Mini Dictionary</a>
        </nav>

        <section class="mt-60 flex w-full items-center justify-center px-1" aria-label="BRAINROT LAB title">
            <div class="relative mx-auto w-[90%] max-w-[380px]">
                <img src="image/Title.png" alt="BRAINROT LAB: Check Your Rizz!" class="h-auto w-full object-contain transition-transform duration-300 ease-out hover:scale-[1.02]">
                <img src="image/character 1.png" alt="" class="absolute -top-7 left-7 w-20 h-auto object-contain z-10 pointer-events-none" aria-hidden="true">
                <img src="image/kaca_pembesar.png" alt="" class="absolute -top-7 -right-3 w-14 h-16 object-contain rotate-[7deg] z-20 pointer-events-none" aria-hidden="true">
            </div>
        </section>

        <section class="relative w-full max-w-[360px] mx-auto px-2 mt-1 flex justify-center items-center" aria-label="Deskripsi Brainrot Lab">
            <p class="text-center text-rose-600 font-bold text-[12px] leading-tight z-0">
                How rizz is your digital comms game?<br>Take this quick test and drop your score at our booth!
            </p>
            <img src="image/tung-tung.png" alt="" class="absolute left-0 top-1/2 -translate-x-4 -translate-y-1/2 w-12 h-auto object-contain z-10 pointer-events-none" aria-hidden="true">
            <img src="image/character 2.png" alt="" class="absolute right-[-15px] top-1/2 -translate-y-1/2 -scale-x-100 w-10 sm:w-11 h-auto object-contain z-10 pointer-events-none" aria-hidden="true">
        </section>

        <section class="mt-20 flex w-full justify-center px-4" aria-label="Start quiz">
            <a href="quiz.html" class="flex w-[60%] max-w-[200px] items-center justify-center rounded-full border-2 border-rose-100 bg-white py-3 text-xl font-black tracking-wider text-rose-600 shadow-[0_8px_20px_-4px_rgba(225,29,72,0.2)] transition-all duration-200 hover:-translate-y-0.5 hover:shadow-[0_10px_24px_-4px_rgba(225,29,72,0.25)] active:scale-95">START</a>
        </section>
    </main>
</body>
</html>
